name: Discovery

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.10"
      - name: Fetch discovery documents
        run: |
          curl --fail --silent --show-error --retry 3 \
            --output "$RUNNER_TEMP/androidpublisher.json" \
            'https://androidpublisher.googleapis.com/$discovery/rest?version=v3'
          curl --fail --silent --show-error --retry 3 \
            --output "$RUNNER_TEMP/playdeveloperreporting.json" \
            'https://playdeveloperreporting.googleapis.com/$discovery/rest?version=v1beta1'
      - name: Compare revisions
        run: |
          go run ./tools/discoverydiff \
            -pins discovery/pins.json \
            -publisher "$RUNNER_TEMP/androidpublisher.json" \
            -reporting "$RUNNER_TEMP/playdeveloperreporting.json" \
            -gomod go.mod
