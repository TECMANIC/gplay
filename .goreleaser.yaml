version: 2

project_name: gplay

builds:
  - id: gplay
    main: ./cmd/gplay
    binary: gplay
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: gplay
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - id: archive
    artifacts: archive

snapshot:
  version_template: "{{ incpatch .Version }}-next"

brews:
  - name: gplay
    repository:
      owner: tecmanic
      name: tap
    homepage: https://github.com/TECMANIC/gplay
    description: Safety-first Google Play Developer API CLI for AI agents
    license: MIT

changelog:
  disable: true
